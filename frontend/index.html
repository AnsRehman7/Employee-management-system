<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/employee.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StaffFlow</title>
    <meta name="theme-color" content="#f7f8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <script>
      // Applied before first paint so a dark-theme user never sees a white flash.
      (function () {
        try {
          var stored = localStorage.getItem("staffflow.theme") || "light";
          var dark =
            stored === "dark" ||
            (stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
